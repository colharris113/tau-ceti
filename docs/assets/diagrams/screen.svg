<text x="155.2" y="110.8" class="fig-label" text-anchor="middle">viewport — 16 × 16 cells</text>
<text x="155.2" y="125.8" class="fig-tick" text-anchor="middle">matrix $CC29 · bitmap $E148 · eight bytes a cell</text>
<text x="252.0" y="283.6" class="fig-label" text-anchor="middle">hires message and status band — rows 19–24</text>
<text x="70.0" y="90.0" class="fig-tick" text-anchor="end">raster 51</text>
<text x="70.0" y="304.0" class="fig-tick" text-anchor="end">250</text>
<line x1="76.0" y1="253.2" x2="428.0" y2="253.2" class="fig-axis"/>
<text x="428.0" y="247.2" class="fig-tick" text-anchor="end">raster 202: the rest of the screen is hires</text>
<text x="252.0" y="322.0" class="fig-muted" text-anchor="middle">40 cells across × 25 down; each cell is 8 × 8 pixels</text>
<rect x="470.0" y="86.0" width="330.0" height="50.0" rx="2" class="fig-cell"/>
<text x="482.0" y="105.0" class="fig-label" text-anchor="start">render buffer</text>
<text x="788.0" y="105.0" class="fig-tick" text-anchor="end">$0400–$0BFF</text>
<text x="482.0" y="120.0" class="fig-tick" text-anchor="start">2,048 bytes · 128 rows of 16</text>
<rect x="470.0" y="144.0" width="330.0" height="50.0" rx="2" class="fig-cell"/>
<text x="482.0" y="163.0" class="fig-label" text-anchor="start">bitmap</text>
<text x="788.0" y="163.0" class="fig-tick" text-anchor="end">$E000–$FFFF</text>
<text x="482.0" y="178.0" class="fig-tick" text-anchor="start">8,192 bytes · eight bytes a cell</text>
<rect x="470.0" y="202.0" width="330.0" height="50.0" rx="2" class="fig-cell"/>
<text x="482.0" y="221.0" class="fig-label" text-anchor="start">matrix</text>
<text x="788.0" y="221.0" class="fig-tick" text-anchor="end">$CC00–$CFE7</text>
<text x="482.0" y="236.0" class="fig-tick" text-anchor="start">1,000 bytes · two colours a cell</text>
<rect x="470.0" y="260.0" width="330.0" height="50.0" rx="2" class="fig-cell"/>
<text x="482.0" y="279.0" class="fig-label" text-anchor="start">colour RAM</text>
<text x="788.0" y="279.0" class="fig-tick" text-anchor="end">$D800–$DBFF</text>
<text x="482.0" y="294.0" class="fig-tick" text-anchor="start">1,000 bytes · pair 11's colour, even in bitmap mode</text>
<text x="470.0" y="326.0" class="fig-muted" text-anchor="start">The VIC sees bank $C000–$FFFF ($DD00 = %00).</text>
<text x="470.0" y="342.0" class="fig-muted" text-anchor="start">$D018 = $38 puts the matrix at $CC00 and the bitmap at $E000.</text>
<text x="40.0" y="380.0" class="fig-title" text-anchor="start">One cell is eight consecutive bytes of bitmap</text>
<text x="40.0" y="398.0" class="fig-muted" text-anchor="start">The buffer is stored by scanline; the bitmap is stored by cell. The blit joins them.</text>
