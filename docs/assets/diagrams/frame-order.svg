<svg width="780" height="260" viewBox="0 0 780 260" role="img" aria-labelledby="fig-frame-order-t fig-frame-order-d" xmlns="http://www.w3.org/2000/svg">
<title id="fig-frame-order-t">An ordinary pass through the flight loop</title>
<desc id="fig-frame-order-d">Prepare the view, update the world, wait for the raster handler, then refresh contacts and dispatch the next game mode.</desc>
<style>
text { font-family: system-ui, sans-serif; font-size: 11px; fill: #25221e; }
.fig-title { font-size: 13px; font-weight: 600; }
.fig-tick { font-size: 10px; }
.fig-tick, .fig-muted, .fig-city, .fig-mark-plain { fill: #534e46; }
.fig-grid, .fig-frame, .fig-hair, .fig-fine { stroke: #c4bdb2; }
.fig-frame { fill: none; }
.fig-axis { stroke: #777067; }
.fig-fine { stroke-width: .4; }
.fig-ochre, .fig-mark-dockable { stroke: #8a5a12; fill: none; }
.fig-blue { stroke: #2465b5; fill: none; }
.fig-ochre, .fig-blue { stroke-width: 2; }
.fig-mark-dockable { stroke-width: 1.6; }
.fig-ochre-fill, .fig-band, .fig-cell-type { fill: #8a5a12; }
.fig-blue-fill { fill: #2465b5; }
.fig-band { fill-opacity: .16; }
.fig-cell { fill: #e8e4dc; }
.fig-cell, .fig-cell-type { stroke: #fff; }
.fig-cell-type { fill-opacity: .55; }
.fig-glyph { fill: #25221e; }
.fig-city { font-size: 9px; font-weight: 600; letter-spacing: .04em; }
</style>
<rect width="780" height="260" fill="#fff"/>
<rect x="60.0" y="14.0" width="660.0" height="49.0" rx="3" class="fig-frame"/>
<text x="80.0" y="43.0" class="fig-tick" text-anchor="start">$202D–$2044</text>
<text x="253.0" y="34.0" class="fig-title" text-anchor="start">Prepare the view</text>
<text x="253.0" y="51.0" class="fig-muted" text-anchor="start">Distance, docking and the painter</text>
<line x1="390.0" y1="63.0" x2="390.0" y2="73.0" class="fig-axis"/>
<line x1="386.0" y1="69.0" x2="390.0" y2="73.0" class="fig-axis"/>
<line x1="394.0" y1="69.0" x2="390.0" y2="73.0" class="fig-axis"/>
<rect x="60.0" y="75.0" width="660.0" height="49.0" rx="3" class="fig-frame"/>
<text x="80.0" y="104.0" class="fig-tick" text-anchor="start">$204C–$2069</text>
<text x="253.0" y="95.0" class="fig-title" text-anchor="start">Update the world</text>
<text x="253.0" y="112.0" class="fig-muted" text-anchor="start">Controls, records and display request</text>
<line x1="390.0" y1="124.0" x2="390.0" y2="134.0" class="fig-axis"/>
<line x1="386.0" y1="130.0" x2="390.0" y2="134.0" class="fig-axis"/>
<line x1="394.0" y1="130.0" x2="390.0" y2="134.0" class="fig-axis"/>
<rect x="60.0" y="136.0" width="660.0" height="49.0" rx="3" class="fig-frame"/>
<text x="80.0" y="165.0" class="fig-tick" text-anchor="start">$206C / $49BD</text>
<text x="253.0" y="156.0" class="fig-title" text-anchor="start">Wait for the raster handler</text>
<text x="253.0" y="173.0" class="fig-muted" text-anchor="start">The handler copies and clears $0348</text>
<line x1="390.0" y1="185.0" x2="390.0" y2="195.0" class="fig-axis"/>
<line x1="386.0" y1="191.0" x2="390.0" y2="195.0" class="fig-axis"/>
<line x1="394.0" y1="191.0" x2="390.0" y2="195.0" class="fig-axis"/>
<rect x="60.0" y="197.0" width="660.0" height="49.0" rx="3" class="fig-frame"/>
<text x="80.0" y="226.0" class="fig-tick" text-anchor="start">$2071–$20B2</text>
<text x="253.0" y="217.0" class="fig-title" text-anchor="start">Refresh contacts and dispatch</text>
<text x="253.0" y="234.0" class="fig-muted" text-anchor="start">Scanner, fuel notices and mode changes</text>
</svg>
