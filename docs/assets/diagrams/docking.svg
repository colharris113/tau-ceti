<svg class="tc-fig" viewBox="0 0 780 380" role="img" aria-labelledby="fig-docking-t fig-docking-d" xmlns="http://www.w3.org/2000/svg">
<title id="fig-docking-t">The docking window: aperture against altitude</title>
<desc id="fig-docking-d">An altitude-versus-aperture plot. Docking is accepted only when the absolute altitude error plus 55 is less than the aperture, which is only possible once the door has opened beyond 55 of its 72 steps.</desc>
<text x="40.0" y="30.0" class="fig-title" text-anchor="start">The docking window: aperture against altitude</text>
<text x="40.0" y="50.0" class="fig-muted" text-anchor="start">A dock is accepted only inside the ochre wedge.</text>
<line x1="84.0" y1="300.0" x2="700.0" y2="300.0" class="fig-grid"/>
<text x="74.0" y="303.0" class="fig-tick" text-anchor="end">0</text>
<line x1="84.0" y1="276.8" x2="700.0" y2="276.8" class="fig-grid"/>
<text x="74.0" y="279.8" class="fig-tick" text-anchor="end">20</text>
<line x1="84.0" y1="253.5" x2="700.0" y2="253.5" class="fig-grid"/>
<text x="74.0" y="256.5" class="fig-tick" text-anchor="end">40</text>
<line x1="84.0" y1="230.3" x2="700.0" y2="230.3" class="fig-grid"/>
<text x="74.0" y="233.3" class="fig-tick" text-anchor="end">60</text>
<line x1="84.0" y1="207.0" x2="700.0" y2="207.0" class="fig-grid"/>
<text x="74.0" y="210.0" class="fig-tick" text-anchor="end">80</text>
<line x1="84.0" y1="183.8" x2="700.0" y2="183.8" class="fig-grid"/>
<text x="74.0" y="186.8" class="fig-tick" text-anchor="end">100</text>
<line x1="84.0" y1="160.5" x2="700.0" y2="160.5" class="fig-grid"/>
<text x="74.0" y="163.5" class="fig-tick" text-anchor="end">120</text>
<line x1="84.0" y1="137.3" x2="700.0" y2="137.3" class="fig-grid"/>
<text x="74.0" y="140.3" class="fig-tick" text-anchor="end">140</text>
<line x1="84.0" y1="114.0" x2="700.0" y2="114.0" class="fig-grid"/>
<text x="74.0" y="117.0" class="fig-tick" text-anchor="end">160</text>
<line x1="84.0" y1="90.8" x2="700.0" y2="90.8" class="fig-grid"/>
<text x="74.0" y="93.8" class="fig-tick" text-anchor="end">180</text>
<text x="84.0" y="318.0" class="fig-tick" text-anchor="middle">0</text>
<text x="238.0" y="318.0" class="fig-tick" text-anchor="middle">18</text>
<text x="392.0" y="318.0" class="fig-tick" text-anchor="middle">36</text>
<text x="546.0" y="318.0" class="fig-tick" text-anchor="middle">54</text>
<text x="700.0" y="318.0" class="fig-tick" text-anchor="middle">72</text>
<line x1="84.0" y1="300.0" x2="700.0" y2="300.0" class="fig-axis"/>
<line x1="84.0" y1="78.0" x2="84.0" y2="300.0" class="fig-axis"/>
<polygon points="554.6,267.5 700.0,247.7 700.0,287.2" class="fig-band"/>
<line x1="554.6" y1="267.5" x2="700.0" y2="267.5" class="fig-ochre"/>
<line x1="84.0" y1="267.5" x2="700.0" y2="267.5" class="fig-hair"/>
<text x="90.0" y="261.5" class="fig-tick" text-anchor="start">docking altitude 28 ($1C)</text>
<text x="564.6" y="230.3" class="fig-label" text-anchor="start">accepted: |alt - 28| + 55 &lt; aperture</text>
<text x="289.3" y="160.5" class="fig-label" text-anchor="middle">no altitude can dock</text>
<text x="289.3" y="169.8" class="fig-tick" text-anchor="middle">until the door is 55/72 open</text>
<line x1="554.6" y1="300.0" x2="554.6" y2="78.0" class="fig-hair"/>
<text x="548.6" y="276.8" class="fig-tick" text-anchor="end">55</text>
<text x="706.0" y="246.5" class="fig-tick" text-anchor="start">45</text>
<text x="706.0" y="288.4" class="fig-tick" text-anchor="start">11</text>
<text x="392.0" y="342.0" class="fig-label" text-anchor="middle">aperture opening (record byte 8, $00-$48)</text>
<text x="28.0" y="189.0" class="fig-label" text-anchor="middle" transform="rotate(-90 28 189.0)">altitude (0-$BF)</text>
</svg>
