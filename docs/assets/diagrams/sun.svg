<svg class="tc-fig" viewBox="0 0 860 450" role="img" aria-labelledby="fig-sun-t fig-sun-d" xmlns="http://www.w3.org/2000/svg">
<title id="fig-sun-t">The sun-driven viewport palettes</title>
<desc id="fig-sun-d">A sixteen-phase sun dial beside four rows of sixteen palette bytes from the table at $C298. Every viewport cell carries the byte; its two nibbles are the two body tones, so both faces of a building shift hue as the sun turns.</desc>
<text x="40.0" y="30.0" class="fig-title" text-anchor="start">The city's colours turn with the sun</text>
<text x="40.0" y="48.0" class="fig-muted" text-anchor="start">Each viewport cell's matrix byte is $C298[(city &amp; 3) × 16 + (sun &gt;&gt; 5)].</text>
<text x="40.0" y="64.0" class="fig-muted" text-anchor="start">Pair 01 (the $55 fill) takes the high nibble; pair 10 (the $AA fill) takes the low nibble.</text>
