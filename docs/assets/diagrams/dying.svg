<svg width="780" height="316" viewBox="0 0 780 316" role="img" aria-labelledby="fig-dying-t fig-dying-d" xmlns="http://www.w3.org/2000/svg">
<title id="fig-dying-t">The two phases of the dying animation</title>
<desc id="fig-dying-d">The first phase, byte 6 falling, varies with the record's starting altitude. The second phase climbs byte 8 and frees the record at $78 for quick-death types or $F8 for the rest.</desc>
<style>
text { font-family: system-ui, sans-serif; font-size: 11px; fill: #25221e; }
.fig-title { font-size: 13px; font-weight: 600; }
.fig-tick { font-size: 10px; }
.fig-tick, .fig-muted, .fig-city, .fig-mark-plain { fill: #534e46; }
.fig-grid, .fig-frame, .fig-hair, .fig-fine { stroke: #c4bdb2; }
.fig-frame { fill: none; }
.fig-axis { stroke: #777067; }
.fig-fine { stroke-width: .4; }
.fig-ochre, .fig-mark-dockable { stroke: #8a5a12; fill: none; }
.fig-blue { stroke: #2465b5; fill: none; }
.fig-ochre, .fig-blue { stroke-width: 2; }
.fig-mark-dockable { stroke-width: 1.6; }
.fig-ochre-fill, .fig-band, .fig-cell-type { fill: #8a5a12; }
.fig-blue-fill { fill: #2465b5; }
.fig-band { fill-opacity: .16; }
.fig-cell { fill: #e8e4dc; }
.fig-cell, .fig-cell-type { stroke: #fff; }
.fig-cell-type { fill-opacity: .55; }
.fig-glyph { fill: #25221e; }
.fig-city { font-size: 9px; font-weight: 600; letter-spacing: .04em; }
</style>
<rect width="780" height="316" fill="#fff"/>
<text x="40.0" y="30.0" class="fig-title" text-anchor="start">Death in two phases</text>
<text x="40.0" y="50.0" class="fig-muted" text-anchor="start">Byte 6 falls by 8 a frame; only when it reaches zero does byte 8 climb.</text>
<line x1="84.0" y1="236.0" x2="700.0" y2="236.0" class="fig-grid"/>
<text x="74.0" y="239.0" class="fig-tick" text-anchor="end">$00</text>
<line x1="84.0" y1="161.5" x2="700.0" y2="161.5" class="fig-grid"/>
<text x="74.0" y="164.5" class="fig-tick" text-anchor="end">$78</text>
<line x1="84.0" y1="82.0" x2="700.0" y2="82.0" class="fig-grid"/>
<text x="74.0" y="85.0" class="fig-tick" text-anchor="end">$F8</text>
<text x="84.0" y="254.0" class="fig-tick" text-anchor="middle">0</text>
<text x="207.2" y="254.0" class="fig-tick" text-anchor="middle">10</text>
<text x="330.4" y="254.0" class="fig-tick" text-anchor="middle">20</text>
<text x="453.6" y="254.0" class="fig-tick" text-anchor="middle">30</text>
<text x="576.8" y="254.0" class="fig-tick" text-anchor="middle">40</text>
<text x="700.0" y="254.0" class="fig-tick" text-anchor="middle">50</text>
<line x1="84.0" y1="236.0" x2="700.0" y2="236.0" class="fig-axis"/>
<line x1="84.0" y1="82.0" x2="84.0" y2="236.0" class="fig-axis"/>
<line x1="40.0" y1="66.0" x2="68.0" y2="66.0" class="fig-ochre"/>
<text x="74.0" y="70.0" class="fig-label" text-anchor="start">ordinary death ($F8)</text>
<line x1="280.0" y1="66.0" x2="308.0" y2="66.0" class="fig-blue"/>
<text x="314.0" y="70.0" class="fig-label" text-anchor="start">quick death ($78)</text>
<text x="108.6" y="96.0" class="fig-tick" text-anchor="start">byte 6 falls (length varies)</text>
<line x1="231.8" y1="236.0" x2="613.8" y2="82.0" class="fig-ochre"/>
<line x1="231.8" y1="236.0" x2="416.6" y2="161.5" class="fig-blue"/>
<text x="619.8" y="86.0" class="fig-label" text-anchor="start">freed at 31 frames</text>
<text x="422.6" y="177.5" class="fig-label" text-anchor="start">freed at 15 frames</text>
<text x="392.0" y="276.0" class="fig-label" text-anchor="middle">frames after byte 6 reaches zero</text>
<text x="28.0" y="159.0" class="fig-label" text-anchor="middle" transform="rotate(-90 28 159.0)">byte 8</text>
</svg>
