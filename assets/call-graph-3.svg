<rect x="50" y="155" width="200" height="28" rx="3" fill="#5a2d62" stroke="#7a4d82" stroke-width="1"/>
<text x="150" y="174" text-anchor="middle" fill="#e080d0" font-family="monospace" font-size="10">Bad Language Check $4E3D</text>

