<rect x="30" y="210" width="160" height="28" rx="3" fill="#4a1942" stroke="#6a3962" stroke-width="1"/>
<text x="110" y="229" text-anchor="middle" fill="#e060c0" font-family="monospace" font-size="9">Move Ship $26A0</text>

