<text x="475" y="70" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="11">Keyboard: JSR $FFBA (GETIN)</text>

<!-- Input handler -->
<rect x="320" y="100" width="310" height="32" rx="4" fill="#1e3a5f" stroke="#3e5a7f" stroke-width="1"/>
<text x="475" y="120" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="11">Input Handler $2A33</text>

