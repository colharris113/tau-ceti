<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto" width="900" height="900">
<rect x="0" y="0" width="400" height="400" fill="#06090f"/>
<!-- City boundary -->
<rect x="20" y="20" width="360" height="360" fill="none" stroke="#1e293b" stroke-width="1" rx="4"/>

<!-- Jump pads at cardinal directions -->
<rect x="175" y="8" width="50" height="18" fill="#f59e0b" opacity=".5" rx="3"/>
<text x="200" y="21" text-anchor="middle" fill="#f59e0b" font-size="9" font-family="monospace">N PAD</text>
<rect x="175" y="374" width="50" height="18" fill="#f59e0b" opacity=".5" rx="3"/>
<text x="200" y="387" text-anchor="middle" fill="#f59e0b" font-size="9" font-family="monospace">S PAD</text>
<rect x="8" y="175" width="18" height="50" fill="#f59e0b" opacity=".5" rx="3"/>
<text x="17" y="204" text-anchor="middle" fill="#f59e0b" font-size="9" font-family="monospace">W</text>
<rect x="374" y="175" width="18" height="50" fill="#f59e0b" opacity=".5" rx="3"/>
<text x="383" y="204" text-anchor="middle" fill="#f59e0b" font-size="9" font-family="monospace">E</text>

<!-- Central docking platform -->
<circle cx="200" cy="200" r="28" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="200" y="204" text-anchor="middle" fill="#34d399" font-size="9" font-family="monospace">DOCK</text>

<!-- Building 1: Main building (large rectangle) -->
<rect x="70" y="70" width="65" height="55" fill="#111827" stroke="#38bdf8" stroke-width="1.5" rx="3"/>
<text x="102" y="95" text-anchor="middle" fill="#38bdf8" font-size="8" font-family="monospace">MAIN</text>
<text x="102" y="108" text-anchor="middle" fill="#64748b" font-size="6" font-family="monospace">Type A</text>

<!-- Building 2: Reactor (square, hostile) -->
<rect x="265" y="70" width="55" height="55" fill="#111827" stroke="#ef4444" stroke-width="1.5" rx="3"/>
<text x="292" y="95" text-anchor="middle" fill="#ef4444" font-size="8" font-family="monospace">ROD</text>
<text x="292" y="108" text-anchor="middle" fill="#64748b" font-size="6" font-family="monospace">Type B</text>

<!-- Building 3: Storage (wide rectangle) -->
<rect x="70" y="275" width="75" height="45" fill="#111827" stroke="#34d399" stroke-width="1.5" rx="3"/>
<text x="107" y="301" text-anchor="middle" fill="#34d399" font-size="8" font-family="monospace">STORE</text>
<text x="107" y="314" text-anchor="middle" fill="#64748b" font-size="6" font-family="monospace">Type C</text>

<!-- Building 4: Robot bay (small square) -->
<rect x="265" y="275" width="45" height="45" fill="#111827" stroke="#a855f7" stroke-width="1.5" rx="3"/>
<text x="287" y="301" text-anchor="middle" fill="#a855f7" font-size="8" font-family="monospace">ROB</text>
<text x="287" y="314" text-anchor="middle" fill="#64748b" font-size="6" font-family="monospace">Type D</text>

<!-- Building 5: Turret (triangle indicator, hostile) -->
<polygon points="310,165 332,200 288,200" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
<text x="310" y="190" text-anchor="middle" fill="#ef4444" font-size="8" font-family="monospace">TWR</text>

<!-- Building 6: Command center -->
<rect x="145" y="320" width="55" height="35" fill="#111827" stroke="#f59e0b" stroke-width="1.5" rx="3"/>
<text x="172" y="341" text-anchor="middle" fill="#f59e0b" font-size="8" font-family="monospace">CMD</text>

<!-- Building 7: Civil base -->
<rect x="265" y="165" width="50" height="35" fill="#111827" stroke="#34d399" stroke-width="1.5" rx="3"/>
<text x="290" y="187" text-anchor="middle" fill="#34d399" font-size="8" font-family="monospace">CIV</text>

<!-- Building 8: Gal-Corp Lander -->
<rect x="85" y="165" width="50" height="35" fill="#111827" stroke="#f59e0b" stroke-width="1.5" rx="3"/>
<text x="110" y="187" text-anchor="middle" fill="#f59e0b" font-size="7" font-family="monospace">LAND</text>

<!-- Robot movement paths -->
<line x1="135" y1="97" x2="160" y2="140" stroke="#a855f7" stroke-width=".8" stroke-dasharray="3,3"/>
<line x1="292" y1="97" x2="270" y2="140" stroke="#a855f7" stroke-width=".8" stroke-dasharray="3,3"/>
<line x1="107" y1="300" x2="140" y2="260" stroke="#a855f7" stroke-width=".8" stroke-dasharray="3,3"/>

<!-- Robot positions -->
<circle cx="160" cy="140" r="5" fill="#a855f7" opacity=".7"/>
<text x="160" y="143" text-anchor="middle" fill="#fff" font-size="5" font-family="monospace">MKI</text>
<circle cx="270" cy="140" r="5" fill="#a855f7" opacity=".7"/>
<text x="270" y="143" text-anchor="middle" fill="#fff" font-size="5" font-family="monospace">MKII</text>
<circle cx="140" cy="260" r="5" fill="#a855f7" opacity=".7"/>
<text x="140" y="263" text-anchor="middle" fill="#fff" font-size="5" font-family="monospace">MKI</text>

<!-- Title -->
<text x="200" y="48" text-anchor="middle" fill="#f59e0b" font-size="13" font-family="monospace" font-weight="bold">REEMA - Local City Map</text>

<!-- Legend -->
<rect x="10" y="362" width="9" height="9" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
<text x="24" y="370" fill="#38bdf8" font-size="7" font-family="monospace">Dockable (Type A-D)</text>
<rect x="150" y="362" width="9" height="9" fill="#111827" stroke="#ef4444" stroke-width="1"/>
<text x="164" y="370" fill="#ef4444" font-size="7" font-family="monospace">Hostile (Turret/Reactor)</text>
<circle cx="290" cy="366" r="4.5" fill="#a855f7"/>
<text x="300" y="370" fill="#a855f7" font-size="7" font-family="monospace">Robot</text>
<rect x="10" y="382" width="9" height="9" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
<text x="24" y="390" fill="#f59e0b" font-size="7" font-family="monospace">Special (CMD/LAND)</text>
</svg>

