<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="900" height="480" fill="#06090f"/>
<!-- Background -->
<rect width="900" height="480" fill="#06090f"/>

<!-- Title -->
<text x="450" y="28" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="16" font-weight="bold">C64 Memory Map - Tau Ceti Usage</text>

<!-- Memory blocks -->
<!-- $0000-$07FF: KERNAL (not used by game) -->
<rect x="50" y="50" width="800" height="35" fill="#1a1a2e" stroke="#2a2a3e" stroke-width="1"/>
<text x="450" y="72" text-anchor="middle" fill="#666" font-family="monospace" font-size="11">KERNAL ROM ($0000-$07FF) - Not used by game</text>

<!-- $0800-$0FFF: Loader -->
<rect x="50" y="95" width="800" height="42" fill="#1a3a5f" stroke="#2a5a8f" stroke-width="1"/>
<text x="450" y="120" text-anchor="middle" fill="#8ab4f8" font-family="monospace" font-size="12">LOADER ($0800-$0FFF) - 8KB</text>
<text x="450" y="133" text-anchor="middle" fill="#6a8ab8" font-family="monospace" font-size="10">XOR $06 decrypted game code, KERNAL LOAD/CHAIN calls</text>

<!-- $1000-$1FFF: Decoded data area -->
<rect x="50" y="142" width="800" height="42" fill="#2d1b4e" stroke="#4d3b6e" stroke-width="1"/>
<text x="450" y="167" text-anchor="middle" fill="#bc8cff" font-family="monospace" font-size="12">DECODED AREA ($1000-$1FFF) - 8KB</text>
<text x="450" y="180" text-anchor="middle" fill="#9c7cbf" font-family="monospace" font-size="10">Game strings, charset init code, KERNAL call stubs</text>

<!-- $2000-$5FFF: Engine Code -->
<rect x="50" y="189" width="800" height="70" fill="#1a3c34" stroke="#2a6c44" stroke-width="1"/>
<text x="450" y="218" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="14" font-weight="bold">MAIN ENGINE CODE ($2000-$5FFF) - 32KB</text>
<text x="450" y="238" text-anchor="middle" fill="#2a9c3a" font-family="monospace" font-size="10">
Main loop $26FA | Combat $2D9F | Reactor $305D | Trade $43EB | Rendering $3E17 | Text output $4127 (84 calls)
</text>
<text x="450" y="253" text-anchor="middle" fill="#2a9c3a" font-family="monospace" font-size="10">
Star field $2741 | Planet render $2310 | Sound effects $6444 | Screen update $330E | Charset init $5105
</text>

<!-- $6000-$7FFF: Draw/World data -->
<rect x="50" y="264" width="800" height="42" fill="#3d2b1f" stroke="#6d5b3f" stroke-width="1"/>
<text x="450" y="289" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="12">DRAW/WORLD DATA ($6000-$7FFF) - 8KB</text>
<text x="450" y="302" text-anchor="middle" fill="#b27912" font-family="monospace" font-size="10">World data tables, planet maps, station layouts, object definitions</text>

<!-- $8000-$8411: VIC-II Charset -->
<rect x="50" y="311" width="800" height="28" fill="#4a1942" stroke="#6a3962" stroke-width="1"/>
<text x="450" y="330" text-anchor="middle" fill="#e060c0" font-family="monospace" font-size="11">VIC-II CHARSET ($8000-$8411) - ~1.7KB</text>

<!-- $8412-$85FF: Custom Lookup Table -->
<rect x="50" y="344" width="800" height="28" fill="#5a2d62" stroke="#7a4d82" stroke-width="1"/>
<text x="450" y="363" text-anchor="middle" fill="#e080d0" font-family="monospace" font-size="11">CUSTOM LOOKUP TABLE ($8412-$85FF) - 512 bytes</text>

<!-- $C000-$DFFF: Screen + VIC-II -->
<rect x="50" y="377" width="800" height="42" fill="#1e3a5f" stroke="#3e5a7f" stroke-width="1"/>
<text x="450" y="402" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="12">SCREEN BUFFER + VIC-II ($C000-$DFFF) - 16KB</text>
<text x="450" y="415" text-anchor="middle" fill="#3886df" font-family="monospace" font-size="10">Screen bitmap at $C000 | VIC-II registers at $D000-$D0FF</text>

<!-- $E000-$FFFF: State + Stack -->
<rect x="50" y="424" width="800" height="35" fill="#2d4a1b" stroke="#4d6a3b" stroke-width="1"/>
<text x="450" y="446" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="11">GAME STATE + STACK ($E000-$FFFF) - 32KB</text>

<!-- Legend -->
<rect x="50" y="465" width="800" height="15" fill="none"/>
<text x="50" y="477" fill="#666" font-family="monospace" font-size="9">Legend: Blue=Loader | Purple=Decoded | Green=Engine | Orange=World Data | Pink=Graphics | Cyan=Screen | Dark Green=State</text>
</svg>

